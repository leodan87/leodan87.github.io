name: Build web

# Compila el portafolio Flutter y publica el resultado en la raíz del repo,
# que es lo que sirve GitHub Pages (www.leodan.dev).
# Se ejecuta al cambiar el código en main, o a mano desde la pestaña Actions.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'assets/img/**'
      - 'assets/icons/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar
        run: flutter build web --release --base-href /

      - name: Copiar el build a la raíz (sin borrar CNAME ni el código fuente)
        run: cp -a build/web/. .

      - name: Publicar en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude)build'
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Build web [skip ci]"
            git push
          fi
